name: A3 quality checks

on:
  push:
    branches:
      - a3/restricted-foundation-scope
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Django, Ruff, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-do-not-reuse-000000000000000000000000000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files are present
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            .python-version requirements.txt requirements-dev.txt manage.py
            config/__init__.py config/settings.py config/urls.py config/wsgi.py config/asgi.py
            health/__init__.py health/views.py
            tests/__init__.py tests/test_health.py pyproject.toml README.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Set up approved Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Generate transitive lock preview from resolved releases
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --dry-run --ignore-installed --report /tmp/requirements-resolution.json -r requirements-dev.txt
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          report = json.loads(Path("/tmp/requirements-resolution.json").read_text())
          entries = []
          for item in report["install"]:
              name = item["metadata"]["name"]
              version = item["metadata"]["version"]
              normalized = re.sub(r"[-_.]+", "-", name).lower()
              request = urllib.request.Request(
                  f"https://pypi.org/pypi/{normalized}/{version}/json",
                  headers={"User-Agent": "EKHC-OS-dependency-lock-review/1.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              hashes = sorted({file["digests"]["sha256"] for file in release["urls"]})
              if not hashes:
                  raise SystemExit(f"No PyPI hashes found for {name}=={version}")
              entries.append(
                  f"{name}=={version} " + " ".join(f"--hash=sha256:{digest}" for digest in hashes)
              )

          print("LOCK_PREVIEW_BEGIN")
          print("\\n\\n".join(sorted(entries, key=str.casefold)))
          print("LOCK_PREVIEW_END")
          PY

      - name: Django system check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-dev.txt
