name: A3 quality checks

on:
  push:
    branches:
      - a3/restricted-foundation-scope
      - 'a3/**'
  pull_request:
    branches:
      - main
      - a3/ci-verification-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Django, Ruff, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-do-not-reuse-000000000000000000000000000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files are present
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            .python-version requirements.txt requirements-dev.txt requirements-lock.txt manage.py
            config/__init__.py config/settings.py config/urls.py config/wsgi.py config/asgi.py config/localization.py config/observability.py config/security.py config/runtime.py
            health/__init__.py health/views.py
            tests/__init__.py tests/test_health.py tests/test_observability.py tests/test_security.py tests/test_runtime.py pyproject.toml README.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Set up approved Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned requirements
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Django system check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-lock.txt
