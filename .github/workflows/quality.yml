name: A3 quality checks

on:
  push:
    branches:
      - a3/restricted-foundation-scope
      - 'a3/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-quality-r1-r3-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Django, ORG-03, Ruff, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-do-not-reuse-000000000000000000000000000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files are present
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            .python-version requirements.txt requirements-dev.txt requirements-lock.txt manage.py
            config/__init__.py config/settings.py config/urls.py config/wsgi.py config/asgi.py config/localization.py config/observability.py config/security.py config/runtime.py
            health/__init__.py health/views.py
            tests/__init__.py tests/test_health.py tests/test_observability.py tests/test_security.py tests/test_runtime.py tests/test_access_control_boundary.py tests/test_supply_chain_baseline.py tests/test_security_monitor.py
            tests/test_org03_event_store.py tests/test_org03_synthetic_access_policy.py tests/test_org03_events.py tests/test_org03_roster.py
            scripts/__init__.py scripts/run_org03_tests.py
            docs/operations/SECURITY-MONITORING-OPERATOR-RUNBOOK.md docs/operations/SECURITY-MONITORING-PRODUCTION-ACTIVATION-GATE.md docs/implementation/A3-MONITORING-OPERATIONAL-READINESS-IMPLEMENTATION-REPORT.md scripts/security_monitor.py docs/security/exception-register.json pyproject.toml README.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Set up approved Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned requirements
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Django system check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: ORG-03 integrity, authority, transition, roster, concurrency, durability, recovery, replay, and access-policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/run_org03_tests.py --xml artifacts/org03-junit.xml 2>&1 | tee artifacts/org03-tests.log

      - name: Ruff lint
        run: ruff check .

      - name: Stage ORG-03 source for formatting repair
        if: always()
        run: |
          mkdir -p artifacts/formatting
          cp scripts/org03_event_store.py tests/test_org03_event_store.py artifacts/formatting/

      - name: Ruff format check
        run: ruff format --check .

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-lock.txt

      - name: Upload ORG-03 JUnit and console evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org03-linux-test-evidence
          path: |
            artifacts/org03-junit.xml
            artifacts/org03-tests.log
            artifacts/formatting/org03_event_store.py
            artifacts/formatting/test_org03_event_store.py
          if-no-files-found: warn
          retention-days: 14
